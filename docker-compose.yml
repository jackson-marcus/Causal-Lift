services:
  mlflow:
    # Serve mlflow from the project's own image so client/server versions match.
    build: .
    command: mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --artifacts-destination /mlflow/artifacts --host 0.0.0.0 --port 5000 --allowed-hosts "mlflow:5000,localhost:5006,127.0.0.1:5006"
    ports:
      - "5006:5000"
    volumes:
      - mlflow-data:/mlflow

  api:
    build: .
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8060:8000"
    depends_on:
      - mlflow
    volumes:
      - ./data:/app/data

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      CAUSALIFT_API_URL: http://api:8000
    ports:
      - "8561:8501"
    depends_on:
      - api

volumes:
  mlflow-data:
